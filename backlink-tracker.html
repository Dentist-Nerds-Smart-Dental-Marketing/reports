<style>

    position: fixed; inset: 0;
    background: #0f1117;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #pw-box {
    background: #1a1d27;
    border: 1px solid #2e3250;
    border-radius: 14px;
    padding: 40px 36px;
    width: 340px;
    text-align: center;
  }
  #pw-box .lock { font-size: 32px; margin-bottom: 16px; }
  #pw-box h2 { font-size: 16px; font-weight: 600; color: #e8eaf0; margin-bottom: 6px; }
  #pw-box p { font-size: 13px; color: #8b90a8; margin-bottom: 24px; }
  #pw-input {
    width: 100%; padding: 10px 14px;
    background: #0f1117; border: 1px solid #2e3250;

    width: 100%; padding: 10px;

  #pw-error { color: #f87171; font-size: 12px; margin-top: 10px; display: none; }

<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --text: #e8eaf0;
    --muted: #8b90a8;
    --accent: #4f8ef7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .logo { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  header h1 { font-size: 18px; font-weight: 600; color: var(--text); }
  header .sep { color: var(--border); font-size: 20px; }

  .toolbar {
    padding: 20px 32px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .search-wrap { position: relative; flex: 0 0 260px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #search {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px 8px 34px;
    border-radius: 8px; font-size: 13px; outline: none; transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  .legend {
    padding: 16px 32px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

  .stats-bar {
    padding: 0 32px 16px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip .count { font-weight: 700; font-size: 14px; }

  .table-wrap {
    padding: 0 32px 40px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead tr {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  th {
    padding: 10px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  th.src-header {
    text-align: center;
    writing-mode: vertical-lr;
    transform: rotate(180deg);
    height: 120px;
    padding: 10px 8px;
    font-size: 10px;
    vertical-align: bottom;
    cursor: default;
  }
  th.src-header .src-name { display: block; }
  th.src-header .src-price { display: block; color: #4ade80; font-size: 9px; margin-top: 3px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody tr.hidden { display: none; }

  td { padding: 10px 12px; vertical-align: middle; }

  .client-name { font-weight: 600; white-space: nowrap; }
  .client-url { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .client-url a { color: var(--muted); text-decoration: none; }
  .client-url a:hover { color: var(--accent); }

  .progress-cell { min-width: 80px; }
  .progress-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    margin-top: 4px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .progress-label { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .cell-wrap { text-align: center; }

  .bl-yes {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 6px;
    background: rgba(34,197,94,.15);
    border: 1px solid rgba(34,197,94,.3);
    color: #4ade80;
    font-size: 14px;
    text-decoration: none;
    transition: all .15s;
  }
  .bl-yes:hover { background: rgba(34,197,94,.3); transform: scale(1.1); }

  .bl-pending {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 6px;
    background: rgba(245,158,11,.1);
    border: 1px solid rgba(245,158,11,.3);
    color: #fbbf24;
    font-size: 12px;
    cursor: default;
    title: "Ordered / In Progress";
  }

  .bl-no {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 6px;
    color: var(--border);
    font-size: 16px;
  }

  .client-note {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: #8b90a8;
    background: rgba(139,144,168,.1);
    border: 1px solid rgba(139,144,168,.2);
    border-radius: 4px;
    padding: 1px 6px;
    margin-top: 3px;
  }

  .select-wrap {
    position: relative;
    flex: 0 0 240px;
  }
  #sourceFilter {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px 8px 34px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    appearance: none;
    transition: border-color .15s;
  }
  #sourceFilter:focus { border-color: var(--accent); }
  #sourceFilter option { background: var(--surface); }

  .focus-col { }
  .focus-col h3 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .focus-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  .focus-card.has {
    background: rgba(34,197,94,.08);
    border: 1px solid rgba(34,197,94,.2);
  }
  .focus-card.pending {
    background: rgba(245,158,11,.08);
    border: 1px solid rgba(245,158,11,.2);
  }
  .focus-card.missing {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .focus-card a {
    color: #4ade80;
    font-size: 11px;
    text-decoration: none;
    opacity: .8;
  }
  .focus-card a:hover { opacity: 1; text-decoration: underline; }
  .focus-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    margin-left: 10px;

  .focus-badge.pend  { background: rgba(245,158,11,.2); color: #fbbf24; }
  .focus-badge.miss  { background: rgba(239,68,68,.1);  color: #f87171; }

  .src-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
  }

  @media (max-width: 600px) {
    header { padding: 16px; }
    .toolbar, .stats-bar, .table-wrap, .legend { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

<div id="pw-gate">
  <div id="pw-box">
    <div class="lock">🔒</div>
    <h2>Dentist Nerds — Internal</h2>
    <p>Enter the team password to continue</p>
    <input type="password" id="pw-input" placeholder="Password" autocomplete="off">
    <button id="pw-btn">Unlock</button>
    <div id="pw-error">Incorrect password. Try again.</div>
  </div>
</div>

<script>
(function() {
  var KEY = "dn_internal_auth";
  if (sessionStorage.getItem(KEY) === "1") {
    document.getElementById("pw-gate").style.display = "none";
  }
  function attempt() {
    if (document.getElementById("pw-input").value === "NerdsTeam") {
      sessionStorage.setItem(KEY, "1");
      document.getElementById("pw-gate").style.display = "none";
    } else {
      document.getElementById("pw-error").style.display = "block";
      document.getElementById("pw-input").value = "";
      document.getElementById("pw-input").focus();
    }
  }
  document.getElementById("pw-btn").addEventListener("click", attempt);
  document.getElementById("pw-input").addEventListener("keydown", function(e) { if (e.key === "Enter") attempt(); });
})();
</script>

// ─── Build Header ─────────────────────────────────────────────────────────────
function buildHeader() {
  const thead = document.getElementById("thead");
  let html = `<tr>
    <th style="min-width:200px;">Client</th>
    <th class="progress-cell" style="min-width:90px;">Progress</th>
    <th style="min-width:90px;text-align:right;">2026 Spend</th>`;
  SOURCES.forEach(s => {
    html += `<th class="src-header" title="${s.name}${s.price ? ' · ' + s.price : ''}">
      <span class="src-name" style="color:${s.color}">${s.name}</span>
      ${s.price ? `<span class="src-price">${s.price}</span>` : ''}
    </th>`;
  });
  html += `</tr>`;
  thead.innerHTML = html;
}

// ─── Build Stats ──────────────────────────────────────────────────────────────
function buildStats() {
  const bar = document.getElementById("statsBar");
  let totalAcquired = 0, totalPending = 0, totalSpend = 0;

  CLIENTS.forEach(c => {
    SOURCES.forEach(s => {
      const v = c.bl[s.id];
      const vv = Array.isArray(v) ? v[0] : v;
      if (vv && vv !== "pending") { totalAcquired++; totalSpend += s.cost; }
      else if (v === "pending") totalPending++;
    });
  });

  const total = CLIENTS.length * SOURCES.length;
  const pct = Math.round(totalAcquired / total * 100);

  bar.innerHTML = `
    <div class="stat-chip">
      <span class="count" style="color:#4f8ef7">${CLIENTS.length}</span>
      <span style="color:var(--muted)">Clients tracked</span>
    </div>
    <div class="stat-chip">
      <span class="count" style="color:#4ade80">${totalAcquired}</span>
      <span style="color:var(--muted)">Backlinks acquired</span>
    </div>
    <div class="stat-chip">
      <span class="count" style="color:#fbbf24">${totalPending}</span>
      <span style="color:var(--muted)">Pending / ordered</span>
    </div>
    <div class="stat-chip">
      <span class="count" style="color:#4f8ef7">${pct}%</span>
      <span style="color:var(--muted)">Overall coverage</span>
    </div>
    <div class="stat-chip">
      <span class="count" style="color:#4ade80">$${totalSpend.toLocaleString()}</span>
      <span style="color:var(--muted)">2026 spend (paid links)</span>
    </div>
  `;
}

  let cells = "";
  SOURCES.forEach(s => {
    const v = c.bl[s.id];
    const vArr = Array.isArray(v) ? v : null;
    const vPrimary = vArr ? vArr[0] : v;
    if (vArr) {
      const links = vArr.map((u,i) => {
        const lang = (u.match(/https?:\/\/(\w+)\.wikipedia\.org/) || [])[1] || (i+1);
        return `<a class="bl-yes" href="${u}" target="_blank" rel="noopener" title="${lang}.wikipedia.org" style="font-size:10px;padding:1px 3px;display:block;line-height:1.5;">${lang}</a>`;
      }).join("");
      cells += `<td class="cell-wrap" style="vertical-align:top;padding:3px 2px;">${links}</td>`;
    } else if (vPrimary && vPrimary !== "pending" && vPrimary !== "yes") {
      cells += `<td class="cell-wrap"><a class="bl-yes" href="${vPrimary}" target="_blank" rel="noopener" title="${s.name}">✓</a></td>`;
    } else if (vPrimary === "yes") {
      cells += `<td class="cell-wrap"><span class="bl-yes" style="cursor:default;" title="${s.name} — acquired (no URL)">✓</span></td>`;
    } else if (vPrimary === "pending") {
      cells += `<td class="cell-wrap"><span class="bl-pending" title="Ordered — URL pending">⏳</span></td>`;
    } else {
      cells += `<td class="cell-wrap"><span class="bl-no">—</span></td>`;
    }
  });

  return `<tr data-name="${c.name.toLowerCase()}">
    <td>
      <div class="client-name">${c.name}</div>
      <div class="client-url"><a href="${c.website}" target="_blank" rel="noopener">${domain}</a></div>
      ${c.note ? `<div><span class="client-note">${c.note}</span></div>` : ''}
    </td>
    <td class="progress-cell">
      <div class="progress-label" style="color:${fillColor}">${acquired}/${total}</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div>
      </div>
    </td>
    <td style="text-align:right;font-weight:600;font-size:13px;white-space:nowrap;color:#4ade80;">${spendStr}</td>
    ${cells}
  </tr>`;
}

function render() {
  document.getElementById("tbody").innerHTML = CLIENTS.map(buildRow).join("");
}

function applySearch() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  document.querySelectorAll("#tbody tr").forEach(row => {
    row.classList.toggle("hidden", q && !row.dataset.name.includes(q));
  });
}

document.getElementById("search").addEventListener("input", applySearch);

// ─── Source Dropdown ──────────────────────────────────────────────────────────
function buildDropdown() {
  const sel = document.getElementById("sourceFilter");
  SOURCES.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.name + (s.price ? ` (${s.price})` : "");
    sel.appendChild(opt);
  });
}

function renderFocusView(sourceId) {
  const src = SOURCES.find(s => s.id === sourceId);
  if (!src) return;

  const hasList    = CLIENTS.filter(c => { const v = c.bl[sourceId]; return Array.isArray(v) ? true : (v && v !== "pending"); });
  const pendList   = CLIENTS.filter(c => { const v = c.bl[sourceId]; return !Array.isArray(v) && v === "pending"; });
  const missList   = CLIENTS.filter(c => { const v = c.bl[sourceId]; return !Array.isArray(v) && !v; });

  document.getElementById("focusHeader").innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <span style="width:10px;height:10px;border-radius:50%;background:${src.color};display:inline-block;flex-shrink:0;"></span>
      <span style="font-size:18px;font-weight:700;color:var(--text);">${src.name}</span>
      ${src.price ? `<span style="font-size:13px;color:#4ade80;font-weight:600;">${src.price} / link</span>` : ""}
      <span style="font-size:12px;color:var(--muted);margin-left:4px;">
        <span style="color:#4ade80;font-weight:700;">${hasList.length}</span> acquired &nbsp;·&nbsp;
        <span style="color:#fbbf24;font-weight:700;">${pendList.length}</span> pending &nbsp;·&nbsp;
        <span style="color:#f87171;font-weight:700;">${missList.length}</span> missing
      </span>
    </div>`;

  function cardHtml(c, type) {
    const v = c.bl[sourceId];
    const vArr = Array.isArray(v) ? v : null;
    const domain = c.website.replace(/https?:\/\/(www\.)?/, "").replace(/\/$/, "");
    const badge = type === "has"
      ? `<span class="focus-badge has">✓ Got it</span>`
      : type === "pending"
      ? `<span class="focus-badge pend">⏳ Pending</span>`
      : `<span class="focus-badge miss">✗ Missing</span>`;
    let linkEl = "";
    if (vArr) {
      linkEl = vArr.map((u,i) => `<a href="${u}" target="_blank" rel="noopener">↗ ${i+1}</a>`).join(" ");
    } else if (v && v !== "pending" && v !== "yes") {
      linkEl = `<a href="${v}" target="_blank" rel="noopener">↗ view</a>`;
    }
    return `<div class="focus-card ${type}">
      <div>
        <div style="font-weight:600;color:var(--text);">${c.name}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">${domain} ${linkEl}</div>
      </div>
      ${badge}
    </div>`;
  }

  const hasSection = `
    <div class="focus-col">
      <h3 style="color:#4ade80;">✓ Has Backlink (${hasList.length + pendList.length})</h3>
      ${hasList.map(c => cardHtml(c, "has")).join("")}
      ${pendList.map(c => cardHtml(c, "pending")).join("")}
      ${hasList.length + pendList.length === 0 ? `<div style="color:var(--muted);font-size:13px;padding:12px 0;">None yet</div>` : ""}
    </div>`;

  const missSection = `
    <div class="focus-col">
      <h3 style="color:#f87171;">✗ Missing Backlink (${missList.length})</h3>
      ${missList.map(c => cardHtml(c, "missing")).join("")}
      ${missList.length === 0 ? `<div style="color:#4ade80;font-size:13px;padding:12px 0;">All clients covered! 🎉</div>` : ""}
    </div>`;

  document.getElementById("focusGrid").innerHTML = hasSection + missSection;
}

document.getElementById("sourceFilter").addEventListener("change", function() {
  const val = this.value;
  const matrix = document.getElementById("matrixWrap");
  const focus  = document.getElementById("focusView");
  const search = document.querySelector(".search-wrap");
  if (val) {
    matrix.style.display = "none";
    focus.style.display  = "block";
    search.style.opacity = "0.4";
    search.style.pointerEvents = "none";
    renderFocusView(val);
  } else {
    matrix.style.display = "";
    focus.style.display  = "none";
    search.style.opacity = "";
    search.style.pointerEvents = "";
  }
});

buildDropdown();
buildHeader();
buildStats();
render();
</script>
</body>
</html>
