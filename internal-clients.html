<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --text: #e8eaf0;
    --muted: #8b90a8;
    --accent: #4f8ef7;
    --seo: #22c55e;
    --meta: #3b82f6;
    --google: #f59e0b;
    --social: #a855f7;
    --hosting: #6b7280;
    --newlaunch: #ec4899;
    --former: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  header .sep { color: var(--border); font-size: 20px; }

  .toolbar {
    padding: 20px 32px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .search-wrap {
    position: relative;
    flex: 0 0 260px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px 8px 34px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .filter-label { color: var(--muted); font-size: 12px; font-weight: 500; margin-right: 4px; }

  .btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    letter-spacing: .3px;
  }
  .btn:hover { color: var(--text); border-color: #4a5280; }
  .btn.active { color: #fff; }

  .btn[data-filter="all"].active { background: var(--accent); border-color: var(--accent); }
  .btn[data-filter="seo"].active { background: var(--seo); border-color: var(--seo); }
  .btn[data-filter="meta"].active { background: var(--meta); border-color: var(--meta); }
  .btn[data-filter="google"].active { background: var(--google); border-color: var(--google); }
  .btn[data-filter="social"].active { background: var(--social); border-color: var(--social); }
  .btn[data-filter="hosting"].active { background: var(--hosting); border-color: var(--hosting); }
  .btn[data-filter="newlaunch"].active { background: var(--newlaunch); border-color: var(--newlaunch); }
  .btn[data-filter="former"].active   { background: var(--former);   border-color: var(--former); }

  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    cursor: pointer;
    user-select: none;
  }
  .toggle-wrap span { font-size: 12px; color: var(--muted); font-weight: 500; }
  .toggle-switch { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    transition: .15s;
  }
  .toggle-track::before {
    content: "";
    position: absolute;
    height: 14px; width: 14px;
    left: 2px; top: 2px;
    background: var(--muted);
    border-radius: 50%;
    transition: .15s;
  }
  .toggle-switch input:checked + .toggle-track { background: var(--former); border-color: var(--former); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(18px); background: #fff; }

  .stats-bar {
    padding: 16px 32px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .stat-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-chip .count { font-weight: 700; font-size: 15px; }
  .stat-chip .lbl { color: var(--muted); }

  .table-wrap {
    padding: 0 32px 40px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
  }
  thead tr {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  th {
    padding: 11px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  th:hover { color: var(--text); }
  th .sort-icon { margin-left: 4px; opacity: .5; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody tr.hidden { display: none; }

  td {
    padding: 12px 14px;
    vertical-align: middle;
  }

  .client-name {
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .doctor-name {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .website-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .website-link:hover { text-decoration: underline; }

  .email-wrap {
    font-size: 12px;
    color: var(--muted);
    max-width: 200px;
  }
  .email-wrap a { color: var(--muted); text-decoration: none; }
  .email-wrap a:hover { color: var(--text); }
  .email-wrap .email2 { margin-top: 2px; }

  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .3px;
    white-space: nowrap;
  }
  .tag-seo     { background: rgba(34,197,94,.15);  color: #4ade80; border: 1px solid rgba(34,197,94,.3); }
  .tag-meta    { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.3); }
  .tag-google  { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.3); }
  .tag-social  { background: rgba(168,85,247,.15); color: #c084fc; border: 1px solid rgba(168,85,247,.3); }
  .tag-hosting { background: rgba(107,114,128,.15);color: #9ca3af; border: 1px solid rgba(107,114,128,.3);}
  .tag-newlaunch{ background: rgba(236,72,153,.15); color: #f472b6; border: 1px solid rgba(236,72,153,.3);}
  .tag-former   { background: rgba(239,68,68,.15);  color: #f87171; border: 1px solid rgba(239,68,68,.3); }

  .blog-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(34,197,94,.12);
    color: #4ade80;
    border: 1px solid rgba(34,197,94,.25);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 10px;
    min-width: 36px;
  }
  .blog-dash { color: var(--border); text-align: center; }

  .empty-msg {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    font-size: 14px;
  }

  @media (max-width: 600px) {
    header { padding: 16px; }
    .toolbar, .stats-bar, .table-wrap { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

<div id="pw-gate">
  <div id="pw-box">
    <div class="lock">🔒</div>
    <h2>Dentist Nerds — Internal</h2>
    <p>Enter the team password to continue</p>
    <input type="password" id="pw-input" placeholder="Password" autocomplete="off">
    <button id="pw-btn">Unlock</button>
    <div id="pw-error">Incorrect password. Try again.</div>
  </div>
</div>

<script>
(function() {
  var KEY = "dn_internal_auth";
  if (sessionStorage.getItem(KEY) === "1") {
    document.getElementById("pw-gate").style.display = "none";
  }
  function attempt() {
    if (document.getElementById("pw-input").value === "NerdsTeam") {
      sessionStorage.setItem(KEY, "1");
      document.getElementById("pw-gate").style.display = "none";
    } else {
      document.getElementById("pw-error").style.display = "block";
      document.getElementById("pw-input").value = "";
      document.getElementById("pw-input").focus();
    }
  }
  document.getElementById("pw-btn").addEventListener("click", attempt);
  document.getElementById("pw-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") attempt();
  });
})();
</script>

// ─── Render ───────────────────────────────────────────────────────────────────
let activeFilter = "all";
let searchQ = "";

function serviceCount(key) {
  return clients.filter(c => c[key]).length;
}

function buildStats() {
  const bar = document.getElementById("statsBar");
  const defs = [
    { key: "all",      label: "Total Clients", color: "#4f8ef7", count: clients.length },
    { key: "seo",      label: "SEO",            color: "#22c55e", count: serviceCount("seo") },
    { key: "meta",     label: "Meta Ads",        color: "#3b82f6", count: serviceCount("meta") },
    { key: "google",   label: "Google Ads",      color: "#f59e0b", count: serviceCount("google") },
    { key: "social",   label: "Social Media",    color: "#a855f7", count: serviceCount("social") },
    { key: "hosting",  label: "Hosting",         color: "#6b7280", count: serviceCount("hosting") },
    { key: "newLaunch",label: "New Launch",      color: "#ec4899", count: serviceCount("newLaunch") },
    { key: "former",   label: "No Longer Client",color: "#ef4444", count: serviceCount("former") },
  ];
  bar.innerHTML = defs.map(d => `
    <div class="stat-chip">
      <span class="dot" style="background:${d.color}"></span>
      <span class="count" style="color:${d.color}">${d.count}</span>
      <span class="lbl">${d.label}</span>
    </div>`).join("");
}

function tagHTML(key, label, cls) {
  return `<span class="tag ${cls}">${label}</span>`;
}

function buildRow(c) {
  const domain = c.website.replace(/https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const tags = [];
  if (c.seo)      tags.push(tagHTML("seo",      "SEO",         "tag-seo"));
  if (c.meta)     tags.push(tagHTML("meta",     "Meta Ads",    "tag-meta"));
  if (c.google)   tags.push(tagHTML("google",   "Google Ads",  "tag-google"));
  if (c.social)   tags.push(tagHTML("social",   "Social",      "tag-social"));
  if (c.hosting)  tags.push(tagHTML("hosting",  "Hosting",     "tag-hosting"));
  if (c.newLaunch)tags.push(tagHTML("newlaunch","New Launch",  "tag-newlaunch"));
  if (c.former)   tags.push(tagHTML("former",  "No Longer Client","tag-former"));
  if (!tags.length) tags.push(`<span style="color:var(--muted);font-size:12px;">—</span>`);

  const emailLine = c.email  ? `<a href="mailto:${c.email}">${c.email}</a>` : "";
  const email2Line = c.email2 ? `<div class="email2"><a href="mailto:${c.email2}">${c.email2}</a></div>` : "";
  const blogCell = c.seo
    ? `<td style="text-align:center;"><span class="blog-badge">${c.blogs}</span></td>`
    : `<td class="blog-dash">—</td>`;

  return `<tr data-seo="${c.seo}" data-meta="${c.meta}" data-google="${c.google}" data-social="${c.social}" data-hosting="${c.hosting}" data-newlaunch="${c.newLaunch}" data-former="${c.former||false}" data-name="${c.name.toLowerCase()}">
    <td>
      <div class="client-name">${c.name}</div>
      ${c.doctor ? `<div class="doctor-name">${c.doctor}</div>` : ""}
    </td>
    <td>
      <a class="website-link" href="${c.website.startsWith("http") ? c.website : "https://"+c.website}" target="_blank" rel="noopener">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        ${domain}
      </a>
    </td>
    <td>
      <div class="email-wrap" style="color:var(--text);font-size:13px;">${c.doctor || '<span style="color:var(--muted)">—</span>'}</div>
    </td>
    <td>
      <div class="email-wrap">
        ${emailLine}
        ${email2Line}
        ${!emailLine && !email2Line ? '<span style="color:var(--border)">—</span>' : ""}
      </div>
    </td>
    <td><div class="tags">${tags.join("")}</div></td>
    ${blogCell}
  </tr>`;
}

function render() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = clients.map(buildRow).join("");
  applyFilters();
}

function applyFilters() {
  const rows = document.querySelectorAll("#tbody tr");
  const showFormer = document.getElementById("showFormer").checked;
  let visible = 0;
  rows.forEach(row => {
    const isFormer = row.dataset.former === "true";
    const nameMatch = !searchQ || row.dataset.name.includes(searchQ);
    let filterMatch = true;
    if (activeFilter !== "all") {
      filterMatch = row.dataset[activeFilter] === "true";
    }
    // Hide former clients unless the toggle is on or the "No Longer Client" filter is active
    const formerOk = !isFormer || showFormer || activeFilter === "former";
    if (nameMatch && filterMatch && formerOk) {
      row.classList.remove("hidden");
      visible++;
    } else {
      row.classList.add("hidden");
    }
  });
  document.getElementById("emptyMsg").style.display = visible === 0 ? "block" : "none";
}

// ─── Events ──────────────────────────────────────────────────────────────────
document.querySelectorAll(".btn[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".btn[data-filter]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById("search").addEventListener("input", e => {
  searchQ = e.target.value.toLowerCase().trim();
  applyFilters();
});

document.getElementById("showFormer").addEventListener("change", applyFilters);

buildStats();
render();
</script>
